      <span class="go">Watch the reels <b></b></span>
    </span>
    <span class="focus" aria-hidden="true"></span>
  </a>
</main>

<script>
(function () {
  var root = document.documentElement, split = document.getElementById('split');
  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var touch = window.matchMedia('(hover: none)').matches;

  // the two halves meet at the seam
  requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.add('ready'); }); });


  // the screen draws itself, then fills in: one of her apps after another
  var imgs = [].slice.call(document.querySelectorAll('#screen img')), wire = document.getElementById('wire');
  [].forEach.call(wire.children, function (el) { var l = el.getTotalLength ? Math.ceil(el.getTotalLength()) + 2 : 600; el.style.setProperty('--len', l); });
  var apps = [
    { name: 'Palettely', screen: 'Home', colours: ['#F97316', '#8B5CF6', '#2A9D8F', '#E9C46A'] },
    { name: 'Night Bloom', screen: 'Home', colours: ['#6366F1', '#4338CA', '#0E1A14', '#C4B5FD'] },
    { name: 'Utilify', screen: 'Tools', colours: ['#FB923C', '#EF4444', '#6C5CE7', '#EEEAFB'] },
    { name: 'Canwasa', screen: 'Explore', colours: ['#EC4899', '#06B6D4', '#0B0B1A', '#8B5CF6'] },
    { name: 'Time Zone Connect', screen: 'World Clock', colours: ['#2563EB', '#6366F1', '#0F172A', '#F1F5F9'] }
  ];
  var chips = document.querySelectorAll('.swatches .chip'), hexes = document.querySelectorAll('.swatches .hex');
  var swName = document.getElementById('swName');
  function paint(a) {
    a.colours.forEach(function (c, k) { chips[k].style.backgroundColor = c; hexes[k].textContent = c; });
    swName.textContent = a.name;
  }
  paint(apps[0]);
  var i = 0;
  function next() {
    var cur = imgs[i]; i = (i + 1) % imgs.length; var nxt = imgs[i];
    wire.classList.remove('draw', 'fade'); void wire.offsetWidth; wire.classList.add('draw');
    cur.classList.remove('on'); cur.classList.add('off');
    setTimeout(function () { nxt.classList.remove('off'); nxt.classList.add('on'); paint(apps[i]); }, 900);
    setTimeout(function () { wire.classList.add('fade'); }, 1900);
    setTimeout(function () { cur.classList.remove('off'); }, 1300);
  }
  if (!still) setInterval(next, 4200);

  // camera timecode from the footage itself
  var reel = document.getElementById('reel'), tc = document.getElementById('tc'), start = Date.now();
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  (function run() {
    var s = (Date.now() - start) / 1000, f = Math.floor((s % 1) * 24);
    tc.textContent = pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(Math.floor(s) % 60) + ':' + pad(f);
    if (!still) requestAnimationFrame(run);
  })();
  if (still) { [].forEach.call(document.querySelectorAll('video'), function (v) { v.removeAttribute('autoplay'); v.pause(); }); }

  // two tools under the pointer: guides on the canvas, a focus square in the viewfinder
  if (!touch) {
    var design = split.querySelector('.design'), content = split.querySelector('.content');
    var gx = design.querySelector('.guide.x'), gy = design.querySelector('.guide.y'), coords = design.querySelector('.coords');
    design.addEventListener('pointermove', function (e) {
      var r = design.getBoundingClientRect(), x = Math.round(e.clientX - r.left), y = Math.round(e.clientY - r.top);
      design.classList.add('tracking');
      gx.style.top = y + 'px'; gy.style.left = x + 'px';
      coords.style.left = (x + 14) + 'px'; coords.style.top = (y + 14) + 'px';
      coords.textContent = 'X ' + x + '  Y ' + y;
    });
    design.addEventListener('pointerleave', function () { design.classList.remove('tracking'); });
    var focus = content.querySelector('.focus');
    content.addEventListener('pointermove', function (e) {
      var r = content.getBoundingClientRect();
      content.classList.add('tracking');
      focus.style.left = (e.clientX - r.left) + 'px'; focus.style.top = (e.clientY - r.top) + 'px';
    });
    content.addEventListener('pointerleave', function () { content.classList.remove('tracking'); });
  }

  // choosing a path: that side sweeps across, then the site opens
  [].forEach.call(document.querySelectorAll('.half'), function (a) {
    a.addEventListener('click', function (e) {
      if (still || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
      e.preventDefault();
      split.classList.add('leaving', 'to-' + a.dataset.path);
      setTimeout(function () { location.href = a.href; }, 720);
    });
  });
  window.addEventListener('pageshow', function () { split.classList.remove('leaving', 'to-design', 'to-content'); });
})();
</script>
</body>
</html>
